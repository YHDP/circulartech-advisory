<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="sub-t sub-d">
  <title id="sub-t">One submission to the EU DPP Registry: up to 100 passports, registered all or nothing</title>
  <desc id="sub-d">A submission holds up to 100 passports of one product group, each with its own web address (UPI), in JSON and at most 10 MB. The Registry fetches every passport at its UPI and checks it. If every passport passes, all are registered and each gets its own registration identifier. If one passport fails, none is registered and the batch has to be submitted again.</desc>
  <defs>
    <marker id="sub-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C8C8C"/>
    </marker>
  </defs>

  <rect width="680" height="560" rx="18" fill="#1D1D1D" stroke="#363636"/>

  <text x="340" y="40" text-anchor="middle" fill="#A7F6AA" font-size="12" font-weight="700" letter-spacing="1.4">REGISTERING THROUGH THE API</text>
  <text x="340" y="68" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Up to 100 passports, registered all or nothing</text>

  <!-- Submission panel -->
  <rect x="40" y="92" width="600" height="200" rx="14" fill="#252525" stroke="#363636"/>
  <text x="60" y="118" fill="#A3A3A3" font-size="11.5" font-weight="700" letter-spacing="1.1">ONE SUBMISSION · ONE PRODUCT GROUP · JSON · MAX 10 MB</text>

  <!-- Passport card template, repeated -->
  <g font-size="15">
    <!-- 1 -->
    <rect x="60" y="134" width="104" height="118" rx="10" fill="#2F2F2F" stroke="#3C3C3C"/>
    <rect x="60" y="134" width="5" height="118" rx="2.5" fill="#A7F6AA"/>
    <rect x="78" y="148" width="28" height="36" rx="4" fill="#1E3A2C" stroke="#4E8A68"/>
    <path d="M84 158 H100 M84 165 H100 M84 172 H94" stroke="#4E8A68" stroke-width="2" stroke-linecap="round"/>
    <text x="78" y="206" fill="#FFFFFF" font-weight="700">Passport</text>
    <text x="78" y="225" fill="#A3A3A3" font-size="12">no. 1</text>
    <text x="78" y="242" fill="#66CCEC" font-size="11" font-family="ui-monospace, Menlo, monospace">…/p/0001</text>

    <!-- 2 -->
    <rect x="176" y="134" width="104" height="118" rx="10" fill="#2F2F2F" stroke="#3C3C3C"/>
    <rect x="176" y="134" width="5" height="118" rx="2.5" fill="#A7F6AA"/>
    <rect x="194" y="148" width="28" height="36" rx="4" fill="#1E3A2C" stroke="#4E8A68"/>
    <path d="M200 158 H216 M200 165 H216 M200 172 H210" stroke="#4E8A68" stroke-width="2" stroke-linecap="round"/>
    <text x="194" y="206" fill="#FFFFFF" font-weight="700">Passport</text>
    <text x="194" y="225" fill="#A3A3A3" font-size="12">no. 2</text>
    <text x="194" y="242" fill="#66CCEC" font-size="11" font-family="ui-monospace, Menlo, monospace">…/p/0002</text>

    <!-- 3 -->
    <rect x="292" y="134" width="104" height="118" rx="10" fill="#2F2F2F" stroke="#3C3C3C"/>
    <rect x="292" y="134" width="5" height="118" rx="2.5" fill="#A7F6AA"/>
    <rect x="310" y="148" width="28" height="36" rx="4" fill="#1E3A2C" stroke="#4E8A68"/>
    <path d="M316 158 H332 M316 165 H332 M316 172 H326" stroke="#4E8A68" stroke-width="2" stroke-linecap="round"/>
    <text x="310" y="206" fill="#FFFFFF" font-weight="700">Passport</text>
    <text x="310" y="225" fill="#A3A3A3" font-size="12">no. 3</text>
    <text x="310" y="242" fill="#66CCEC" font-size="11" font-family="ui-monospace, Menlo, monospace">…/p/0003</text>

    <!-- ellipsis -->
    <rect x="408" y="134" width="104" height="118" rx="10" fill="none" stroke="#5A5A5A" stroke-dasharray="5 4"/>
    <text x="460" y="194" text-anchor="middle" fill="#A3A3A3" font-size="26" font-weight="700">…</text>
    <text x="460" y="222" text-anchor="middle" fill="#A3A3A3" font-size="12">up to 100</text>

    <!-- 100 -->
    <rect x="524" y="134" width="104" height="118" rx="10" fill="#2F2F2F" stroke="#3C3C3C"/>
    <rect x="524" y="134" width="5" height="118" rx="2.5" fill="#A7F6AA"/>
    <rect x="542" y="148" width="28" height="36" rx="4" fill="#1E3A2C" stroke="#4E8A68"/>
    <path d="M548 158 H564 M548 165 H564 M548 172 H558" stroke="#4E8A68" stroke-width="2" stroke-linecap="round"/>
    <text x="542" y="206" fill="#FFFFFF" font-weight="700">Passport</text>
    <text x="542" y="225" fill="#A3A3A3" font-size="12">no. 100</text>
    <text x="542" y="242" fill="#66CCEC" font-size="11" font-family="ui-monospace, Menlo, monospace">…/p/0100</text>
  </g>
  <text x="60" y="276" fill="#BDBDBD" font-size="13">Each item is one passport with its own web address, the UPI.</text>

  <line x1="340" y1="294" x2="340" y2="328" stroke="#8C8C8C" stroke-width="2" marker-end="url(#sub-arrow)"/>

  <!-- Registry -->
  <rect x="40" y="338" width="600" height="72" rx="12" fill="#87E1CB"/>
  <text x="60" y="364" fill="#0E3B32" font-size="12" font-weight="700" letter-spacing="1.2">EU DPP REGISTRY</text>
  <text x="60" y="392" fill="#161616" font-size="16" font-weight="700">Fetches every passport at its UPI and checks it</text>

  <line x1="185" y1="412" x2="185" y2="444" stroke="#8C8C8C" stroke-width="2" marker-end="url(#sub-arrow)"/>
  <line x1="495" y1="412" x2="495" y2="444" stroke="#8C8C8C" stroke-width="2" marker-end="url(#sub-arrow)"/>

  <!-- Outcomes -->
  <rect x="40" y="454" width="290" height="86" rx="12" fill="#1E3A2C" stroke="#4E8A68"/>
  <text x="60" y="480" fill="#A7F6AA" font-size="12" font-weight="700" letter-spacing="1.1">EVERY PASSPORT PASSES</text>
  <text x="60" y="506" fill="#FFFFFF" font-size="16" font-weight="700">All are registered</text>
  <text x="60" y="526" fill="#BDBDBD" font-size="13">each with its own registration ID</text>

  <rect x="350" y="454" width="290" height="86" rx="12" fill="#3A2026" stroke="#7A3B47"/>
  <text x="370" y="480" fill="#FF8A99" font-size="12" font-weight="700" letter-spacing="1.1">ONE PASSPORT FAILS</text>
  <text x="370" y="506" fill="#FFFFFF" font-size="16" font-weight="700">None is registered</text>
  <text x="370" y="526" fill="#BDBDBD" font-size="13">fix it, then resubmit the batch</text>
</svg>
